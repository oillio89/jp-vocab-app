<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>คลังคำศัพท์ญี่ปุ่น</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #EDE7DC;
    min-height: 100vh;
  }
  body {
    padding: 24px 16px;
  }
  @media (max-width: 480px) {
    body { padding: 0; }
  }
</style>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap');

  #jp-app {
    --paper: #EDE7DC;
    --paper-2: #E4DCC9;
    --paper-3: #F5F1E6;
    --ink: #2A2A26;
    --ink-soft: #5B564C;
    --indigo: #2F4864;
    --indigo-soft: #6C8AA6;
    --seal: #B33A3A;
    --moss: #6E7A52;
    --border: #C9BFA9;

    --serif: 'Shippori Mincho', serif;
    --thai: 'Noto Sans Thai', 'Noto Sans', sans-serif;

    background: var(--paper);
    color: var(--ink);
    font-family: var(--thai);
    border-radius: 4px;
    padding: 0;
    max-width: 640px;
    margin: 0 auto;
    box-sizing: border-box;
  }
  #jp-app * { box-sizing: border-box; }

  .jp-header { padding: 28px 24px 18px; border-bottom: 1px solid var(--border); }
  .jp-header h1 { font-family: var(--serif); font-size: 28px; font-weight: 700; color: var(--indigo); margin: 0 0 4px; letter-spacing: 0.02em; }
  .jp-header p { margin: 0; color: var(--ink-soft); font-size: 14px; }

  .jp-tabs-row { display: flex; align-items: flex-end; padding: 14px 24px 0; gap: 8px; }
  .jp-tab {
    font-family: var(--thai); font-weight: 600; font-size: 14px;
    padding: 10px 18px 12px; background: var(--paper-2); color: var(--ink-soft);
    border: 1px solid var(--border); border-bottom: none; border-radius: 6px 6px 0 0;
    cursor: pointer; position: relative; top: 1px; transition: color 0.15s ease;
  }
  .jp-tab.active { background: var(--paper-3); color: var(--indigo); border-bottom: 1px solid var(--paper-3); }
  .jp-tab:not(.active):hover { color: var(--ink); }

  .jp-panel { background: var(--paper-3); border: 1px solid var(--border); border-radius: 0 6px 6px 6px; min-height: 360px; padding: 24px; }

  .jp-list { display: flex; flex-direction: column; gap: 8px; }
  .jp-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 12px;
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 4px;
  }
  .jp-item-main { display: flex; flex-direction: column; min-width: 0; }
  .jp-item-word { font-family: var(--serif); font-size: 18px; color: var(--ink); }
  .jp-item-reading { font-size: 12px; color: var(--indigo-soft); }
  .jp-item-meaning { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }

  .jp-item-tag-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .jp-item-tag { display: inline-block; font-size: 11px; color: var(--moss); border: 1px solid var(--moss); border-radius: 3px; padding: 1px 6px; width: fit-content; }
  .jp-item-verbgroup { display: inline-block; font-size: 11px; color: var(--indigo); border: 1px solid var(--indigo-soft); border-radius: 3px; padding: 1px 6px; width: fit-content; }

  .jp-search-input {
    width: 100%;
    font-family: var(--thai);
    font-size: 14px;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: #fff;
    color: var(--ink);
    margin-bottom: 12px;
  }
  .jp-search-input:focus { outline: 2px solid var(--indigo-soft); outline-offset: 1px; }
  .jp-filter-row { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; font-size: 13px; color: var(--ink-soft); flex-wrap: wrap; }
  .jp-filter-row select { font-family: var(--thai); font-size: 13px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 4px; background: #fff; color: var(--ink); }

  .jp-btn { font-family: var(--thai); font-weight: 600; font-size: 14px; padding: 9px 18px; border-radius: 4px; border: 1px solid var(--indigo); background: var(--indigo); color: var(--paper-3); cursor: pointer; }
  .jp-btn:hover { background: #24384f; }

  .jp-empty { text-align: center; padding: 40px 20px; color: var(--ink-soft); font-size: 14px; line-height: 1.7; }
  .jp-empty .jp-empty-glyph { font-family: var(--serif); font-size: 36px; color: var(--border); display: block; margin-bottom: 10px; }

  .jp-review-wrap { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .jp-review-progress { font-size: 13px; color: var(--ink-soft); }
  .jp-flashcard { width: 100%; max-width: 380px; height: 240px; perspective: 1000px; cursor: pointer; }
  .jp-flashcard-inner { position: relative; width: 100%; height: 100%; transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); transform-style: preserve-3d; }
  .jp-flashcard.flipped .jp-flashcard-inner { transform: rotateY(180deg); }
  .jp-flashcard-face { position: absolute; inset: 0; backface-visibility: hidden; border: 1px solid var(--border); border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
  .jp-flashcard-front { background: var(--paper); }
  .jp-flashcard-back { background: var(--indigo); color: var(--paper-3); transform: rotateY(180deg); }
  .jp-flashcard-word { font-family: var(--serif); font-size: 40px; margin-bottom: 8px; }
  .jp-flashcard-reading { font-size: 15px; color: var(--indigo-soft); }
  .jp-flashcard-back .jp-flashcard-reading { color: var(--paper-2); }
  .jp-flashcard-meaning { font-family: var(--serif); font-size: 22px; margin-bottom: 6px; }
  .jp-flashcard-example { font-size: 13px; opacity: 0.85; margin-top: 8px; max-width: 300px; }
  .jp-flashcard-hint { font-size: 12px; color: var(--ink-soft); }

  .jp-known-row { display: flex; gap: 10px; }
  .jp-mark-btn { font-family: var(--thai); font-size: 13px; font-weight: 600; padding: 8px 16px; border-radius: 4px; cursor: pointer; border: 1px solid var(--border); background: var(--paper); color: var(--ink-soft); }
  .jp-mark-btn.know { border-color: var(--indigo); color: var(--indigo); }
  .jp-mark-btn.know:hover { background: var(--indigo); color: #fff; }
  .jp-mark-btn.dontknow { border-color: var(--seal); color: var(--seal); }
  .jp-mark-btn.dontknow:hover { background: var(--seal); color: #fff; }

  .jp-session-summary { text-align: center; padding: 30px 10px; }
  .jp-stamp { display: inline-block; font-family: var(--serif); font-size: 15px; color: var(--seal); border: 2px solid var(--seal); border-radius: 6px; padding: 8px 18px; transform: rotate(-4deg); margin: 14px 0; }

  .jp-quiz-progress { font-size: 13px; color: var(--ink-soft); margin-bottom: 14px; }
  .jp-quiz-question { font-family: var(--serif); font-size: 32px; text-align: center; margin: 10px 0 6px; }
  .jp-quiz-reading { text-align: center; font-size: 14px; color: var(--indigo-soft); margin-bottom: 22px; }
  .jp-quiz-options { display: flex; flex-direction: column; gap: 10px; }
  .jp-quiz-option { font-family: var(--thai); font-size: 14px; text-align: left; padding: 12px 14px; border: 1px solid var(--border); border-radius: 5px; background: var(--paper); cursor: pointer; color: var(--ink); }
  .jp-quiz-option:hover:not(:disabled) { border-color: var(--indigo-soft); }
  .jp-quiz-option.correct { border-color: var(--indigo); background: #E4EBF0; color: var(--indigo); font-weight: 600; }
  .jp-quiz-option.incorrect { border-color: var(--seal); background: #F5E4E1; color: var(--seal); }
  .jp-quiz-option:disabled { cursor: default; opacity: 0.85; }
  .jp-quiz-next-row { margin-top: 18px; text-align: center; }
  .jp-quiz-result { text-align: center; padding: 20px 10px; }
  .jp-quiz-score { font-family: var(--serif); font-size: 48px; color: var(--indigo); margin: 10px 0; }

  .jp-guide-card { background: var(--paper); border: 1px solid var(--border); border-radius: 6px; padding: 16px 18px; margin-bottom: 14px; }
  .jp-guide-card h3 { font-family: var(--serif); font-size: 18px; color: var(--indigo); margin: 0 0 6px; display: flex; align-items: center; gap: 8px; }
  .jp-guide-card .jp-guide-num { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; background: var(--indigo); color: var(--paper-3); font-family: var(--thai); font-size: 13px; font-weight: 700; }
  .jp-guide-card p { font-size: 13px; color: var(--ink-soft); line-height: 1.7; margin: 0 0 8px; }
  .jp-guide-formula { font-family: var(--serif); font-size: 14px; color: var(--ink); background: var(--paper-2); border-radius: 4px; padding: 8px 12px; margin-bottom: 10px; }
  .jp-guide-examples { display: flex; flex-direction: column; gap: 4px; }
  .jp-guide-example { font-size: 13px; color: var(--ink); display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-bottom: 1px dashed var(--border); }
  .jp-guide-example:last-child { border-bottom: none; }
  .jp-guide-example .jp-guide-word { font-family: var(--serif); }
  .jp-guide-example .jp-guide-meaning { color: var(--ink-soft); font-size: 12px; }

  .jp-list-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
  .jp-list-grid .jp-item { height: 100%; align-items: flex-start; }
  .jp-item-card { position: relative; display: block; padding-right: 76px; }
  .jp-item-tag-corner {
    position: absolute;
    top: 10px;
    right: 10px;
    flex-direction: column;
    align-items: flex-end;
    gap: 3px;
    margin-top: 0;
  }
  .jp-item-tag-corner .jp-item-tag,
  .jp-item-tag-corner .jp-item-verbgroup {
    font-size: 10px;
    padding: 1px 5px;
    white-space: nowrap;
  }

  .jp-quizmode-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .jp-quiz-meaning-prompt { font-family: var(--thai); font-size: 20px; line-height: 1.6; text-align: center; color: var(--ink); margin: 12px 0 22px; }
  .jp-typed-input { width: 100%; font-family: var(--thai); font-size: 15px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 5px; background: #fff; color: var(--ink); margin-bottom: 10px; }
  .jp-typed-input:focus { outline: 2px solid var(--indigo-soft); outline-offset: 1px; }
  .jp-typed-input.correct { border-color: var(--indigo); background: #E4EBF0; }
  .jp-typed-input.incorrect { border-color: var(--seal); background: #F5E4E1; }
  .jp-typed-feedback { font-size: 14px; margin-bottom: 12px; }
  .jp-typed-feedback.correct { color: var(--indigo); }
  .jp-typed-feedback.incorrect { color: var(--seal); }
  .jp-typed-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .jp-quizmode-btn { font-family: var(--thai); font-size: 13px; font-weight: 600; padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border); background: var(--paper); color: var(--ink-soft); cursor: pointer; }
  .jp-quizmode-btn.active { background: var(--indigo); border-color: var(--indigo); color: var(--paper-3); }
  .jp-quizmode-btn:not(.active):hover { border-color: var(--indigo-soft); color: var(--indigo); }

  @media (max-width: 480px) {
    .jp-header { padding: 22px 16px 14px; }
    .jp-tabs-row { padding: 12px 16px 0; }
    .jp-panel { padding: 16px; }
  }
</style>

    {"id":"vmtwpryvop4j83","word":"～ごろ","reading":"","meaning":"ราว~, ราวๆ (เกี่ยวกับเวลา)","example":"","tag":"13","verbGroup":"","masuForm":""},
    {"id":"vmtwpryvo06xbb","word":"なにか","reading":"何か","meaning":"บางสิ่งบางอย่าง, อะไรสักอย่าง","example":"","tag":"13","verbGroup":"","masuForm":""},
    {"id":"vmtwpryvononqr","word":"どこか","reading":"","meaning":"ที่ไหนสักแห่ง, บางแห่ง","example":"","tag":"13","verbGroup":"","masuForm":""},
    {"id":"vmtwpryvooehp2","word":"のどが　かわきます","reading":"","meaning":"กระหายน้ำ, หิวน้ำ","example":"","tag":"13","verbGroup":"","masuForm":""},
    {"id":"vmtwpryvoxdfk3","word":"おなかが　すきます","reading":"","meaning":"หิวข้าว","example":"","tag":"13","verbGroup":"","masuForm":""},

    {"id":"vmtwpryvo00mhx","word":"ごちゅうもんは？","reading":"ご注文は？","meaning":"จะรับอะไรดีครับ/คะ","example":"","tag":"13","verbGroup":"","masuForm":""},
    {"id":"vmtwpryvoj5pri","word":"ていしょく","reading":"定食","meaning":"อาหารชุด","example":"","tag":"13","verbGroup":"","masuForm":""},
    {"id":"vmtwpryvodaptr","word":"ぎゅうどん","reading":"牛どん","meaning":"ข้าวหน้าเนื้อวัว","example":"","tag":"13","verbGroup":"","masuForm":""}
  ];

  let state = {
    vocab: VOCAB,
    tab: 'list',
    filterGroup: '',
    filterTag: '',
    searchQuery: '',
    review: { order: [], index: 0, flipped: false, known: 0, dontknow: 0, finished: false },
    quizMode: 'meaning',
    quiz: { questions: [], index: 0, score: 0, selected: null, finished: false, tooFew: false }
  };

  function esc(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function getFilteredVocab() {
    return state.vocab.filter(v => {
      const groupOk = !state.filterGroup || (v.verbGroup || '') === state.filterGroup;
      const tagOk = !state.filterTag || (v.tag || '') === state.filterTag;
      return groupOk && tagOk;
    });
  }

  function setTab(tab) {
    state.tab = tab;
    if (tab === 'review') startReview();
    if (tab === 'quiz') startQuiz();
    render();
  }

  function setFilterGroup(val) {
    state.filterGroup = val;
    if (state.tab === 'review') startReview();
    if (state.tab === 'quiz') startQuiz();
    render();
  }

  function setFilterTag(val) {
    state.filterTag = val;
    if (state.tab === 'review') startReview();
    if (state.tab === 'quiz') startQuiz();
    render();
  }

  // ---------- Review ----------
  function startReview() {
    const order = shuffle(getFilteredVocab().map(v => v.id));
    state.review = { order, index: 0, flipped: false, known: 0, dontknow: 0, finished: order.length === 0 };
  }

  function flipCard() { state.review.flipped = !state.review.flipped; render(); }

  function markCard(known) {
    if (known) state.review.known++; else state.review.dontknow++;
    nextCard();
  }

  function nextCard() {
    const r = state.review;
    if (r.index + 1 >= r.order.length) { r.finished = true; }
    else { r.index++; r.flipped = false; }
    render();
  }

  function restartReview() { startReview(); render(); }

  // ---------- Quiz ----------
  function buildQuiz() {
    if (state.quizMode === 'group') {
      const pool = shuffle(getFilteredVocab().filter(v => v.verbGroup));
      const count = Math.min(10, pool.length);
      return pool.slice(0, count).map(v => ({
        id: v.id, word: v.word, reading: v.reading,
        correct: v.verbGroup,
        options: ['1', '2', '3'],
        isGroupQuiz: true
      }));
    }
    if (state.quizMode === 'typed') {
      const pool = shuffle(getFilteredVocab());
      const count = Math.min(10, pool.length);
      return pool.slice(0, count).map(v => ({
        id: v.id, meaning: v.meaning,
        correct: v.word,
        isTyped: true
      }));
    }
    const pool = shuffle(getFilteredVocab());
    const count = Math.min(10, pool.length);
    const chosen = pool.slice(0, count);
    return chosen.map(v => {
      const others = state.vocab.filter(x => x.id !== v.id).map(x => x.meaning);
      const distractors = shuffle(others).slice(0, 3);
      const options = shuffle([v.meaning, ...distractors]);
      return { id: v.id, word: v.word, reading: v.reading, correct: v.meaning, options };
    });
  }

  function startQuiz() {
    if (state.quizMode === 'group') {
      if (getFilteredVocab().filter(v => v.verbGroup).length === 0) {
        state.quiz = { questions: [], index: 0, score: 0, selected: null, finished: false, tooFew: true };
        return;
      }
    } else if (state.quizMode === 'typed') {
      if (getFilteredVocab().length === 0) {
        state.quiz = { questions: [], index: 0, score: 0, selected: null, finished: false, tooFew: true };
        return;
      }
    } else if (state.vocab.length < 2 || getFilteredVocab().length === 0) {
      state.quiz = { questions: [], index: 0, score: 0, selected: null, finished: false, tooFew: true };
      return;
    }
    state.quiz = { questions: buildQuiz(), index: 0, score: 0, selected: null, typedCorrect: null, finished: false, tooFew: false };
  }

  function setQuizMode(mode) {
    state.quizMode = mode;
    startQuiz();
    render();
  }

  function selectOption(opt) {
    if (state.quiz.selected !== null) return;
    state.quiz.selected = opt;
    if (opt === state.quiz.questions[state.quiz.index].correct) state.quiz.score++;
    render();
  }

  function normalizeAnswer(s) {
    return String(s || '')
      .replace(/[,.;:!?'"`*~\-_/\\()\[\]{}<>「」『』（）〔〕【】〈〉《》、。・！？：；＝＋～]/g, '')
      .replace(/[\s\u3000]+/g, '')
      .toLowerCase();
  }

  function isTypedAnswerCorrect(input, correctWord) {
    const norm = normalizeAnswer(input);
    if (!norm) return false;
    return norm === normalizeAnswer(correctWord);
  }

  function submitTypedAnswer() {
    const q = state.quiz;
    if (q.selected !== null) return;
    const el = document.getElementById('jp-typed-input');
    if (!el) return;
    const val = el.value.trim();
    if (!val) return;
    q.selected = val;
    q.typedCorrect = isTypedAnswerCorrect(val, q.questions[q.index].correct);
    if (q.typedCorrect) q.score++;
    render();
  }

  function revealTypedAnswer() {
    const q = state.quiz;
    if (q.selected !== null) return;
    q.selected = '';
    q.typedCorrect = false;
    render();
  }

  function nextQuestion() {
    const q = state.quiz;
    if (q.index + 1 >= q.questions.length) { q.finished = true; }
    else { q.index++; q.selected = null; }
    render();
  }

  function restartQuiz() { startQuiz(); render(); }

  // ---------- Render ----------
  function renderFilterRow(showGroupFilter) {
    if (showGroupFilter === undefined) showGroupFilter = true;
    const tags = Array.from(new Set(state.vocab.map(v => v.tag).filter(Boolean))).sort();
    return `
      <div class="jp-filter-row">
        ${showGroupFilter ? `
          <span>กรองตามกลุ่มคำกริยา:</span>
          <select id="jp-filter-group">
            <option value="" ${state.filterGroup === '' ? 'selected' : ''}>ทั้งหมด</option>
            <option value="1" ${state.filterGroup === '1' ? 'selected' : ''}>กลุ่ม 1 (u-verb)</option>
            <option value="2" ${state.filterGroup === '2' ? 'selected' : ''}>กลุ่ม 2 (ru-verb)</option>
            <option value="3" ${state.filterGroup === '3' ? 'selected' : ''}>กลุ่ม 3 (อื่นๆ)</option>
          </select>
        ` : ''}
        ${tags.length > 0 ? `
          <span>บทเรียน:</span>
          <select id="jp-filter-tag">
            <option value="" ${state.filterTag === '' ? 'selected' : ''}>ทั้งหมด</option>
            ${tags.map(t => `<option value="${esc(t)}" ${state.filterTag === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}
          </select>
        ` : ''}
      </div>
    `;
  }

  function render() {
    const tabs = [
      { id: 'list', label: 'คำศัพท์ทั้งหมด' },
      { id: 'review', label: 'ทบทวน' },
      { id: 'quiz', label: 'แบบทดสอบ' },
      { id: 'guide', label: 'กลุ่มคำกริยา' }
    ];

    root.innerHTML = `
      <div class="jp-header">
        <h1>語彙 &nbsp;คลังคำศัพท์ญี่ปุ่น</h1>
        <p>ทบทวนด้วยการ์ดหรือทำแบบทดสอบ</p>
        <p style="margin-top:4px; font-size:12px; color:var(--ink-soft);">อัปเดตล่าสุด: 11 กันยายน 2569</p>
      </div>
      <div class="jp-tabs-row">
        ${tabs.map(t => `<div class="jp-tab ${state.tab === t.id ? 'active' : ''}" data-action="set-tab" data-tab="${t.id}">${t.label}</div>`).join('')}
      </div>
      <div class="jp-panel" id="jp-panel"></div>
    `;

    const panel = document.getElementById('jp-panel');
    if (state.tab === 'quiz') renderQuiz(panel);
    else if (state.tab === 'guide') renderGuide(panel);
    else if (state.tab === 'list') renderList(panel);
    else renderReview(panel);
  }

  function renderList(panel) {
    if (state.vocab.length === 0) {
      panel.innerHTML = `<div class="jp-empty"><span class="jp-empty-glyph">語</span>ยังไม่มีคำศัพท์ในคลัง</div>`;
      return;
    }
    const tags = Array.from(new Set(state.vocab.map(v => v.tag).filter(Boolean))).sort();
    const q = (state.searchQuery || '').trim().toLowerCase();
    const filtered = state.vocab.filter(v => {
      const tagOk = !state.filterTag || (v.tag || '') === state.filterTag;
      if (!tagOk) return false;
      if (!q) return true;
      const haystack = [v.word, v.reading, v.meaning, v.masuForm].filter(Boolean).join(' ').toLowerCase();
      return haystack.includes(q);
    });

    panel.innerHTML = `
      <input type="text" id="jp-search-input" class="jp-search-input" placeholder="ค้นหาคำศัพท์ คำอ่าน หรือความหมาย..." value="${esc(state.searchQuery)}" />
      ${tags.length > 0 ? `
        <div class="jp-filter-row">
          <span>กรองตามบทเรียน:</span>
          <select id="jp-filter-tag">
            <option value="" ${state.filterTag === '' ? 'selected' : ''}>ทั้งหมด (${state.vocab.length} คำ)</option>
            ${tags.map(t => {
              const count = state.vocab.filter(v => v.tag === t).length;
              return `<option value="${esc(t)}" ${state.filterTag === t ? 'selected' : ''}>บทที่ ${esc(t)} (${count} คำ)</option>`;
            }).join('')}
          </select>
        </div>
      ` : `<div style="font-size:12px; color:var(--ink-soft); margin-bottom:14px;">ทั้งหมด ${state.vocab.length} คำ</div>`}
      ${filtered.length === 0 ? `
        <div class="jp-empty"><span class="jp-empty-glyph">空</span>ไม่พบคำศัพท์ที่ตรงกับคำค้นหา</div>
      ` : `
        <div class="jp-list-grid">
          ${filtered.map(v => `
            <div class="jp-item jp-item-card">
              ${(v.tag || v.verbGroup) ? `
                <div class="jp-item-tag-row jp-item-tag-corner">
                  ${v.verbGroup ? `<span class="jp-item-verbgroup">กลุ่ม ${esc(v.verbGroup)}</span>` : ''}
                  ${v.tag ? `<span class="jp-item-tag">บท ${esc(v.tag)}</span>` : ''}
                </div>
              ` : ''}
              <div class="jp-item-main">
                <div class="jp-item-word">${esc(v.word)}${v.reading ? ` <span class="jp-item-reading">${esc(v.reading)}</span>` : ''}</div>
                ${v.masuForm ? `<div class="jp-item-reading" style="margin-top:1px;">ます: ${esc(v.masuForm)}</div>` : ''}
                <div class="jp-item-meaning">${esc(v.meaning)}</div>
              </div>
            </div>
          `).join('')}
        </div>
      `}
    `;
  }

  function renderGuide(panel) {
    const groups = [
      {
        num: '1',
        title: 'กลุ่ม 1 (u-verb / godan)',
        desc: 'คำกริยาที่ dictionary form ลงท้ายด้วยเสียงสระ う (う, く, ぐ, す, つ, ぬ, ぶ, む, る) โดยที่ る ในกลุ่มนี้ พยางค์หน้าจะ "ไม่ใช่" เสียง い หรือ え เช่น 乗る (のる) หรือ 帰る (かえる)',
        formula: 'วิธีผัน ます: เปลี่ยนเสียงท้ายจากแถว う เป็นแถว い แล้วเติม ます เช่น 飲む (のむ) → 飲みます, 話す (はなす) → 話します',
        fallback: [

        fallback: [
          { word: '食べる (たべる)', meaning: 'กิน' },

        formula: 'วิธีผัน ます: する → します, 来る (くる) → 来ます (きます) ต้องจำแยกเป็นคำๆ ไป',
        fallback: [

      }
    ];

    panel.innerHTML = `
      <div style="font-size:13px; color:var(--ink-soft); margin-bottom:16px;">
        สรุปหลักการแบ่งกลุ่มคำกริยาภาษาญี่ปุ่น และวิธีผันเป็นรูป ます ของแต่ละกลุ่ม
      </div>
      ${groups.map(g => {
        const matches = state.vocab.filter(v => v.verbGroup === g.num);
        const examples = matches.length > 0
          ? matches.slice(0, 5).map(v => ({ word: v.word + (v.reading ? ` (${v.reading})` : ''), meaning: v.meaning }))
          : g.fallback;
        return `
          <div class="jp-guide-card">

              ${examples.map(ex => `
                <div class="jp-guide-example">
                  <span class="jp-guide-word">${esc(ex.word)}</span>

            ${matches.length > 0 ? `<div style="font-size:11px; color:var(--moss); margin-top:8px;">* ตัวอย่างจากคำศัพท์ในคลังของคุณ</div>` : ''}
          </div>
        `;

  function renderReview(panel) {
    if (state.vocab.length === 0) {
      panel.innerHTML = `<div class="jp-empty"><span class="jp-empty-glyph">習</span>ยังไม่มีคำศัพท์</div>`;
      return;
    }
    const r = state.review;
    if (getFilteredVocab().length === 0) {
      panel.innerHTML = `
        ${renderFilterRow()}
        <div class="jp-empty"><span class="jp-empty-glyph">空</span>ไม่มีคำศัพท์ในกลุ่มที่เลือก<br/>ลองเปลี่ยนตัวกรองดู</div>`;
      return;
    }
    if (r.finished) {
      panel.innerHTML = `
        ${renderFilterRow()}
        <div class="jp-session-summary">
          <div style="color:var(--ink-soft); font-size:14px;">ทบทวนครบแล้ว</div>
          <div class="jp-stamp">済 ทบทวนเสร็จ</div>
          <div style="font-size:15px; margin-top:6px;">รู้แล้ว ${r.known} คำ · ยังไม่รู้ ${r.dontknow} คำ</div>
          <div style="margin-top:20px;"><button class="jp-btn" data-action="restart-review">ทบทวนอีกรอบ</button></div>
        </div>`;
      return;
    }
    const v = state.vocab.find(x => x.id === r.order[r.index]);
    if (!v) { nextCard(); return; }
    panel.innerHTML = `
      ${renderFilterRow()}
      <div class="jp-review-wrap">
        <div class="jp-review-progress">คำที่ ${r.index + 1} / ${r.order.length}</div>
        <div class="jp-flashcard ${r.flipped ? 'flipped' : ''}" data-action="flip-card">
          <div class="jp-flashcard-inner">
            <div class="jp-flashcard-face jp-flashcard-front">
              <div class="jp-flashcard-word">${esc(v.word)}</div>
              ${v.reading ? `<div class="jp-flashcard-reading">${esc(v.reading)}</div>` : ''}
              ${v.masuForm ? `<div class="jp-flashcard-reading" style="margin-top:6px;">ます: ${esc(v.masuForm)}</div>` : ''}
              ${(v.tag || v.verbGroup) ? `
                <div class="jp-item-tag-row" style="justify-content:center; margin-top:10px;">
                  ${v.verbGroup ? `<span class="jp-item-verbgroup">กลุ่ม ${esc(v.verbGroup)}</span>` : ''}
                  ${v.tag ? `<span class="jp-item-tag">${esc(v.tag)}</span>` : ''}
                </div>
              ` : ''}
              <div class="jp-flashcard-hint" style="margin-top:14px;">แตะเพื่อดูความหมาย</div>
            </div>
            <div class="jp-flashcard-face jp-flashcard-back">
              <div class="jp-flashcard-meaning">${esc(v.meaning)}</div>
              ${v.example ? `<div class="jp-flashcard-example">${esc(v.example)}</div>` : ''}
            </div>
          </div>
        </div>
        <div class="jp-known-row">
          <button class="jp-mark-btn dontknow" data-action="mark-dontknow">ยังไม่รู้</button>
          <button class="jp-mark-btn know" data-action="mark-know">รู้แล้ว</button>
        </div>
      </div>
    `;
  }

  function renderQuiz(panel) {
    const modeToggle = `
      <div class="jp-quizmode-row">
        <button type="button" class="jp-quizmode-btn ${state.quizMode === 'meaning' ? 'active' : ''}" data-action="set-quiz-mode" data-mode="meaning">ทดสอบความหมาย</button>
        <button type="button" class="jp-quizmode-btn ${state.quizMode === 'typed' ? 'active' : ''}" data-action="set-quiz-mode" data-mode="typed">พิมพ์คำตอบ</button>
        <button type="button" class="jp-quizmode-btn ${state.quizMode === 'group' ? 'active' : ''}" data-action="set-quiz-mode" data-mode="group">ทดสอบกลุ่มคำกริยา</button>
      </div>
    `;
    const showGroupFilter = state.quizMode !== 'group';

    if (state.quizMode === 'meaning' && state.vocab.length < 2) {
      panel.innerHTML = `${modeToggle}<div class="jp-empty"><span class="jp-empty-glyph">試</span>ต้องมีคำศัพท์อย่างน้อย 2 คำถึงจะทำแบบทดสอบได้</div>`;
      return;
    }
    const q = state.quiz;
    if (q.tooFew) {
      panel.innerHTML = `
        ${modeToggle}
        ${renderFilterRow(showGroupFilter)}
        <div class="jp-empty"><span class="jp-empty-glyph">空</span>${state.quizMode === 'group' ? 'ไม่มีคำกริยาที่ระบุกลุ่มไว้ในตัวกรองนี้' : 'ไม่มีคำศัพท์ในกลุ่มที่เลือก'}<br/>ลองเปลี่ยนตัวกรองดู</div>`;
      return;
    }
    if (q.finished) {
      panel.innerHTML = `
        ${modeToggle}
        ${renderFilterRow(showGroupFilter)}
        <div class="jp-quiz-result">
          <div style="color:var(--ink-soft); font-size:14px;">ผลการทดสอบ</div>
          <div class="jp-quiz-score">${q.score} / ${q.questions.length}</div>
          <button class="jp-btn" data-action="restart-quiz">ทำแบบทดสอบใหม่</button>
        </div>`;
      return;
    }
    const question = q.questions[q.index];

    if (question.isTyped) {
      const answered = q.selected !== null;
      const inputCls = !answered ? '' : (q.typedCorrect ? 'correct' : 'incorrect');
      panel.innerHTML = `
        ${modeToggle}
        ${renderFilterRow(showGroupFilter)}
        <div class="jp-quiz-progress">ข้อ ${q.index + 1} / ${q.questions.length} · คะแนน ${q.score}</div>
        <div class="jp-quiz-meaning-prompt">${esc(question.meaning)}</div>
        <input type="text" id="jp-typed-input" class="jp-typed-input ${inputCls}" placeholder="พิมพ์คำศัพท์ (ฮิรางานะ/คาตากานะ)..." ${answered ? 'disabled' : ''} value="${answered ? esc(q.selected) : ''}" />
        ${answered ? `
          <div class="jp-typed-feedback ${q.typedCorrect ? 'correct' : 'incorrect'}">
            ${q.typedCorrect ? '✓ ถูกต้อง!' : `✗ ไม่ถูกต้อง — เฉลย: ${esc(question.correct)}`}
          </div>
          <div class="jp-typed-actions">
            <button class="jp-btn" data-action="next-question">${q.index + 1 >= q.questions.length ? 'ดูผลคะแนน' : 'ข้อถัดไป'}</button>
          </div>
        ` : `
          <div class="jp-typed-actions">
            <button class="jp-btn" data-action="submit-typed">ตรวจคำตอบ</button>
            <button class="jp-btn secondary" data-action="reveal-typed">ไม่รู้ ดูเฉลย</button>
          </div>
        `}
      `;
      const inputEl = document.getElementById('jp-typed-input');
      if (inputEl && !answered) inputEl.focus();
      return;
    }

    const optionLabel = (opt) => question.isGroupQuiz ? ('กลุ่ม ' + opt) : opt;
    panel.innerHTML = `
      ${modeToggle}
      ${renderFilterRow(showGroupFilter)}
      <div class="jp-quiz-progress">ข้อ ${q.index + 1} / ${q.questions.length} · คะแนน ${q.score}</div>
      <div class="jp-quiz-question">${esc(question.word)}</div>
      ${question.reading ? `<div class="jp-quiz-reading">${esc(question.reading)}</div>` : ''}
      ${question.isGroupQuiz ? `<div class="jp-quiz-reading" style="margin-bottom:10px;">คำกริยานี้อยู่กลุ่มไหน?</div>` : ''}
      <div class="jp-quiz-options">
        ${question.options.map(opt => {
          let cls = '';
          if (q.selected !== null) {
            if (opt === question.correct) cls = 'correct';
            else if (opt === q.selected) cls = 'incorrect';
          }
          return `<button class="jp-quiz-option ${cls}" data-action="select-option" data-opt="${esc(opt)}" ${q.selected !== null ? 'disabled' : ''}>${esc(optionLabel(opt))}</button>`;
        }).join('')}
      </div>
      ${q.selected !== null ? `<div class="jp-quiz-next-row"><button class="jp-btn" data-action="next-question">${q.index + 1 >= q.questions.length ? 'ดูผลคะแนน' : 'ข้อถัดไป'}</button></div>` : ''}
    `;
  }

  // ---------- Delegated events ----------
  function handleAppClick(e) {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const action = btn.dataset.action;
    switch (action) {
      case 'set-tab': setTab(btn.dataset.tab); break;
      case 'flip-card': flipCard(); break;
      case 'mark-know': e.stopPropagation(); markCard(true); break;
      case 'mark-dontknow': e.stopPropagation(); markCard(false); break;
      case 'restart-review': restartReview(); break;
      case 'select-option': selectOption(btn.dataset.opt); break;
      case 'submit-typed': submitTypedAnswer(); break;
      case 'reveal-typed': revealTypedAnswer(); break;
      case 'next-question': nextQuestion(); break;
      case 'restart-quiz': restartQuiz(); break;
      case 'set-quiz-mode': setQuizMode(btn.dataset.mode); break;
    }
  }

  function handleAppChange(e) {
    const t = e.target;
    if (t.id === 'jp-filter-group') { setFilterGroup(t.value); }
    if (t.id === 'jp-filter-tag') { setFilterTag(t.value); }
  }

  let isComposingSearch = false;

  function commitSearchQuery(inputEl) {
    const pos = inputEl.selectionStart;
    state.searchQuery = inputEl.value;
    render();
    const el = document.getElementById('jp-search-input');
    if (el) {
      el.focus();
      try { el.setSelectionRange(pos, pos); } catch (err) {}
    }
  }

  function handleAppInput(e) {
    if (e.target.id === 'jp-search-input' && !isComposingSearch) {
      commitSearchQuery(e.target);
    }
  }

  function handleAppCompositionStart(e) {
    if (e.target.id === 'jp-search-input') isComposingSearch = true;
  }

  function handleAppCompositionEnd(e) {
    if (e.target.id === 'jp-search-input') {
      isComposingSearch = false;
      commitSearchQuery(e.target);
    }
  }

  function handleAppKeydown(e) {
    if (e.target.id === 'jp-typed-input' && e.key === 'Enter') {
      e.preventDefault();
      submitTypedAnswer();
    }
  }

  window.addEventListener('error', function(ev) {
    const banner = document.createElement('div');
    banner.style.cssText = 'background:#F5E4E1;color:#B33A3A;padding:10px 16px;font-size:12px;font-family:sans-serif;border-bottom:1px solid #B33A3A;';
    banner.textContent = 'เกิดข้อผิดพลาด: ' + ev.message;
    root.prepend(banner);
  });

  root.addEventListener('click', handleAppClick);
  root.addEventListener('change', handleAppChange);
  root.addEventListener('input', handleAppInput);
  root.addEventListener('keydown', handleAppKeydown);
  root.addEventListener('compositionstart', handleAppCompositionStart);
  root.addEventListener('compositionend', handleAppCompositionEnd);

  startReview();
  render();
})();
</script>
</body>
</html>
